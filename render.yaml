services:
  - type: web
    name: driveeasy
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: driveeasy-db
          property: connectionString

databases:
  - name: driveeasy-db
    databaseName: driveeasy
    user: driveeasy
    plan: free